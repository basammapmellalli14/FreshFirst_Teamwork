
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh First - Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #5427a8, #352071);
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 40px 35px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo-icon {
    font-size: 48px;
}

.logo h1 {
    color: #5427a8;
    font-size: 28px;
    margin-top: 8px;
}

.logo p {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

h2 {
    text-align: center;
    color: #25213a;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #5427a8;
    box-shadow: 0 0 0 2px rgba(84,39,168,0.1);
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #673ab7, #452080);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

.login-btn:hover {
    opacity: 0.9;
}

.error {
    display: none;
    color: #dc2626;
    background: #fee2e2;
    padding: 11px;
    border-radius: 7px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 15px;
}

.demo-box {
    margin-top: 22px;
    padding: 14px;
    background: #f5f1ff;
    border-radius: 9px;
    font-size: 13px;
    color: #4b3677;
    line-height: 1.8;
}

.demo-box h3 {
    margin-bottom: 5px;
    font-size: 14px;
}

.footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 22px;
}

</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <div class="logo-icon">🥬</div>
        <h1>Fresh First</h1>
        <p>Perishable Stock Verification System</p>
    </div>

    <h2>Welcome Back!</h2>

    <div class="error" id="errorMessage" role="alert" aria-live="polite"></div>

    <form id="loginForm">

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="demo-box">
        <h3>Demo Login Details</h3>
        <p><b>Admin username:</b> admin</p>
        <p><b>Manager username:</b> manager1</p>
        <p><b>Staff username:</b> staff1</p>
        <p>Passwords must match the accounts configured in the MySQL users table.</p>
    </div>

    <div class="footer">
        © 2026 Fresh First | Perishable Stock Management
    </div>

</div>

<script src="js/login.js" defer></script>


</body>
</html>
