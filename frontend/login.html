
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh First - Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #5427a8, #352071);
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 40px 35px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo-icon {
    font-size: 48px;
}

.logo h1 {
    color: #5427a8;
    font-size: 28px;
    margin-top: 8px;
}

.logo p {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

h2 {
    text-align: center;
    color: #25213a;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #5427a8;
    box-shadow: 0 0 0 2px rgba(84,39,168,0.1);
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #673ab7, #452080);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

.login-btn:hover {
    opacity: 0.9;
}

.error {
    display: none;
    color: #dc2626;
    background: #fee2e2;
    padding: 11px;
    border-radius: 7px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 15px;
}

.demo-box {
    margin-top: 22px;
    padding: 14px;
    background: #f5f1ff;
    border-radius: 9px;
    font-size: 13px;
    color: #4b3677;
    line-height: 1.8;
}

.demo-box h3 {
    margin-bottom: 5px;
    font-size: 14px;
}

.footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 22px;
}

</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <div class="logo-icon">🥬</div>
        <h1>Fresh First</h1>
        <p>Perishable Stock Verification System</p>
    </div>

    <h2>Welcome Back!</h2>

    <div class="error" id="errorMessage">
        Invalid username or password. Please try again.
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="demo-box">
        <h3>Demo Login Details</h3>
        <p><b>Admin:</b> admin / admin123</p>
        <p><b>Manager:</b> manager / manager123</p>
        <p><b>Staff:</b> staff / staff123</p>
    </div>

    <div class="footer">
        © 2026 Fresh First | Perishable Stock Management
    </div>

</div>

<script>

// CREATE DEMO USERS IF THEY DO NOT EXIST
function createDemoUsers() {

    let users = [];

    try {
        users = JSON.parse(
            localStorage.getItem("freshFirstUsers") || "[]"
        );

        if (!Array.isArray(users)) {
            users = [];
        }
    } catch (error) {
        users = [];
    }

    const demoUsers = [
        {
            id: 1,
            fullName: "Admin",
            username: "admin",
            password: "admin123",
            role: "Admin"
        },
        {
            id: 2,
            fullName: "Manager",
            username: "manager",
            password: "manager123",
            role: "Store Manager"
        },
        {
            id: 3,
            fullName: "Staff",
            username: "staff",
            password: "staff123",
            role: "Staff"
        }
    ];

    demoUsers.forEach(demoUser => {

        const exists = users.some(user =>
            String(user.username || "").toLowerCase() ===
            demoUser.username.toLowerCase()
        );

        if (!exists) {
            users.push(demoUser);
        }

    });

    localStorage.setItem(
        "freshFirstUsers",
        JSON.stringify(users)
    );
}

// LOGIN
document.getElementById("loginForm").addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        createDemoUsers();

        const username = document
            .getElementById("username")
            .value.trim();

        const password = document
            .getElementById("password")
            .value;

        const users = JSON.parse(
            localStorage.getItem("freshFirstUsers") || "[]"
        );

        const loggedInUser = users.find(user =>

            String(user.username || "").toLowerCase() ===
            username.toLowerCase() &&

            (
                user.password === password ||
                user.passwordHash === password
            )

        );

        if (!loggedInUser) {

            document.getElementById("errorMessage").style.display =
                "block";

            return;
        }

        const userData = {
            id: loggedInUser.id,
            fullName: loggedInUser.fullName ||
                      loggedInUser.full_name ||
                      loggedInUser.username,
            username: loggedInUser.username,
            role: loggedInUser.role
        };

        localStorage.setItem(
            "user",
            JSON.stringify(userData)
        );

        localStorage.setItem(
            "username",
            userData.username
        );

        localStorage.setItem(
            "role",
            userData.role
        );

        window.location.href = "dashboard.html";

    }
);

// HIDE ERROR WHEN TYPING
document.getElementById("username").addEventListener(
    "input",
    hideError
);

document.getElementById("password").addEventListener(
    "input",
    hideError
);

function hideError() {
    document.getElementById("errorMessage").style.display = "none";
}

</script>

</body>
</html>
